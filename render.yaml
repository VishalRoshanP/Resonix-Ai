# RESONIX AI — Render Blueprint Configuration (Root Repository)
# Backend Web Service Deployment Spec for Render.com

services:
  - type: web
    name: resonix-ai-backend
    env: node
    rootDir: server
    region: singapore
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        sync: false # Render dynamically assigns PORT in production
      - key: MONGODB_URI
        sync: false # Set securely in Render Dashboard
      - key: JWT_SECRET
        sync: false # Set securely in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render Dashboard
      - key: GEMMA_MODEL
        value: gemma-4-26b-a4b-it
      - key: GOOGLE_AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta
      - key: PINECONE_API_KEY
        sync: false # Set securely in Render Dashboard
      - key: PINECONE_ENVIRONMENT
        value: us-east-1
      - key: PINECONE_INDEX_NAME
        value: resonix-disaster-knowledge
      - key: CORS_ORIGIN
        sync: false # Set to allowed production web client origins (e.g., https://your-citizen.vercel.app,https://your-responder.vercel.app)
